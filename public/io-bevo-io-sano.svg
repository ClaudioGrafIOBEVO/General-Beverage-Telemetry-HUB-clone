<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 220" width="100%" height="100%">
  <!-- Left Brand: io sano -->
  <g id="io-sano-brand" transform="translate(20, 20)">
    <!-- Teal Open Frame -->
    <path 
      d="M 175 110 L 175 25 L 30 25 L 30 110" 
      fill="none" 
      stroke="#026578" 
      stroke-width="5.5" 
      stroke-linecap="square"
    />
    
    <!-- Red Sketch Heart -->
    <path 
      d="M 102 65 C 96 50, 78 48, 68 58 C 55 71, 56 94, 82 114 C 95 124, 102 129, 106 132 C 107 131, 114 122, 122 114 C 138 98, 148 83, 143 67 C 138 52, 120 48, 110 58 C 106 62, 104 65, 102 65 Z" 
      fill="none" 
      stroke="#dc2626" 
      stroke-width="4.2" 
      stroke-linecap="round" 
      stroke-linejoin="round"
      stroke-dasharray="200"
      stroke-dashoffset="0"
    />
    <!-- Heart sketch secondary inner stroke for authentic hand-drawn feel -->
    <path 
      d="M 104 66 C 98 52, 79 50, 70 60 C 58 72, 60 93, 84 112 C 96 122, 103 127, 105 129" 
      fill="none" 
      stroke="#e11d48" 
      stroke-width="2.5" 
      stroke-linecap="round" 
      opacity="0.85"
    />

    <!-- Text: io sano in Teal #026578 -->
    <g fill="#026578" font-family="'Century Gothic', 'Outfit', 'Segoe UI', Arial, sans-serif">
      <!-- i -->
      <circle cx="32" cy="116" r="4.2" />
      <rect x="28.5" y="126" width="7" height="34" rx="2" />
      <!-- o -->
      <circle cx="62" cy="143" r="16.5" fill="none" stroke="#026578" stroke-width="6.5" />
      <!-- sano -->
      <text x="88" y="157" font-size="44" font-weight="500" letter-spacing="-1">sano</text>
    </g>
  </g>

  <!-- Right Brand: io bevo in Vibrant Green #15803d -->
  <g id="io-bevo-brand" transform="translate(320, 25)">
    <!-- Big 'io' -->
    <g fill="#168a44">
      <!-- i -->
      <circle cx="28" cy="30" r="11" />
      <rect x="18" y="54" width="20" height="85" rx="6" />
      <!-- o -->
      <circle cx="95" cy="97" r="42" fill="none" stroke="#168a44" stroke-width="19" />
    </g>

    <!-- 'bevo' below 'io' -->
    <g fill="#168a44" font-family="'Century Gothic', 'Outfit', 'Segoe UI', Arial, sans-serif">
      <text x="14" y="186" font-size="52" font-weight="400" letter-spacing="-1.5">bevo</text>
    </g>
  </g>
</svg>
